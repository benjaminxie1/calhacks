services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bp
      POSTGRES_PASSWORD: bp
      POSTGRES_DB: breakpoint
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bp"]
      interval: 2s
      retries: 30
    volumes: [bpdata:/var/lib/postgresql/data]
volumes:
  bpdata:
