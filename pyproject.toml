[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proven"
version = "0.0.1"
description = "FraudShield Swarm: specialist agents investigate a suspicious-transaction alert; policy in code decides"
requires-python = ">=3.10"
dependencies = ["anthropic", "droid-sdk[mcp]", "pyyaml", "pydantic", "python-dotenv"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["fraudshield*", "proven*"]

[tool.pytest.ini_options]
testpaths = ["fraudshield/tests"]
